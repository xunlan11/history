pipeline_name: PP-StructureV3

batch_size: 8

use_doc_preprocessor: True
# 不初始化表格结构、印章、公式和图表转表格模型；图表保留版面区域并提取图片。
use_seal_recognition: False
use_table_recognition: False
use_formula_recognition: False
use_chart_recognition: False
use_region_detection: True
format_block_content: False
markdown_ignore_labels:
  - number
  - footnote
  - header
  - header_image
  - footer
  - footer_image
  - aside_text

SubModules:
  LayoutDetection:
    module_name: layout_detection
    model_name: PP-DocLayout_plus-L
    model_dir: null
    batch_size: 8
    threshold: 
      0: 0.3  # 段落标题
      1: 0.5  # 图像
      2: 0.4  # 文本
      3: 0.5  # 编号
      4: 0.5  # 摘要
      5: 0.5  # 内容
      6: 0.5  # 图表标题
      7: 0.3  # 公式
      8: 0.5  # 表格
      9: 0.5  # 参考文献
      10: 0.5 # 文档标题
      11: 0.5 # 脚注
      12: 0.5 # 页眉
      13: 0.5 # 算法
      14: 0.5 # 页脚
      15: 0.45 # 印章
      16: 0.5 # 图表
      17: 0.5 # 公式编号
      18: 0.5 # 旁注文本
      19: 0.5 # 参考文献内容
    layout_nms: True
    layout_unclip_ratio: [1.0, 1.0] 
    layout_merge_bboxes_mode: 
      0: "large"  # 段落标题
      1: "large"  # 图像
      2: "union"  # 文本
      3: "union"  # 编号
      4: "union"  # 摘要
      5: "union"  # 内容
      6: "union"  # 图表标题
      7: "large"  # 公式
      8: "union"  # 表格
      9: "union"  # 参考文献
      10: "union" # 文档标题
      11: "union" # 脚注
      12: "union" # 页眉
      13: "union" # 算法
      14: "union" # 页脚
      15: "union" # 印章
      16: "large" # 图表
      17: "union" # 公式编号
      18: "union" # 旁注文本
      19: "union" # 参考文献内容
  RegionDetection:
    module_name: layout_detection
    model_name: PP-DocBlockLayout
    model_dir: null
    layout_nms: True
    layout_merge_bboxes_mode: "small"

SubPipelines:
  DocPreprocessor:
    pipeline_name: doc_preprocessor
    batch_size: 8
    use_doc_orientation_classify: True
    use_doc_unwarping: True
    SubModules:
      DocOrientationClassify:
        module_name: doc_text_orientation
        model_name: PP-LCNet_x1_0_doc_ori
        model_dir: null
        batch_size: 8
      DocUnwarping:
        module_name: image_unwarping
        model_name: UVDoc
        model_dir: null

  GeneralOCR:
    pipeline_name: OCR
    batch_size: 8
    text_type: general
    use_doc_preprocessor: False
    use_textline_orientation: True
    SubModules:
      TextDetection:
        module_name: text_detection
        model_name: PP-OCRv5_server_det
        model_dir: null
        limit_side_len: 736
        limit_type: min
        max_side_limit: 4000
        thresh: 0.3
        box_thresh: 0.6
        unclip_ratio: 1.5
      TextLineOrientation:
        module_name: textline_orientation
        model_name: PP-LCNet_x1_0_textline_ori
        model_dir: null
        batch_size: 8
      TextRecognition:
        module_name: text_recognition
        model_name: PP-OCRv5_server_rec
        model_dir: null
        batch_size: 8
        score_thresh: 0.0
