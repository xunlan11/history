[project]
name = "history-platform"
version = "0.1.0"
description = "近代军史数智平台"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "lunar-python==1.4.8",
    "uvicorn",
    "python-multipart",
    "pydantic",
    "Pillow",
    "PyMuPDF",
    "psycopg[binary]>=3.1",
    "opencc>=1.4.2",
    "numpy>=2.0",
    "tokenizers>=0.21",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
