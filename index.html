<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>近代军史数智平台</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <main class="main">
        <section class="view active" id="library-view" aria-label="首页">
          <header class="home-statusbar">
            <div class="service-strip" aria-label="服务链接状态">
              <span class="service-item service-item-version">
                版本：<b id="version-service-status" class="service-warn">检查中</b>
                <button class="status-action hidden" id="version-update-button" type="button">更新</button>
              </span>
              <span class="service-item">OCR：<b id="ocr-service-status" class="service-warn">未连接</b></span>
              <span class="service-item service-item-llm">大模型：<b id="llm-service-status" class="service-warn">未连接</b></span>
            </div>
            <div class="status-title">
              <p class="eyebrow">近代军史数智平台</p>
            </div>
            <div class="font-setting" aria-label="全局字体设置">
              <span class="font-setting-label">字体</span>
              <div class="font-options" role="group" aria-label="字体">
                <button class="font-option" type="button" data-font-option="hei">黑体</button>
                <button class="font-option" type="button" data-font-option="kai">楷体</button>
              </div>
            </div>
          </header>

          <div class="home-board">
            <aside class="home-sidebar chat-sidebar" aria-label="对话记录">
              <div class="sidebar-heading">
                <h2>对话记录</h2>
                <button class="ghost-link" id="new-conversation" type="button">新建 ＋</button>
              </div>
              <div class="conversation-list" id="conversation-list"></div>
            </aside>

            <div class="center-stack">
              <section class="message-panel" aria-label="书库问答消息">
                <div class="message-head">
                  <h2 id="chat-title">新对话</h2>
                  <span id="chat-hint">输入后在这里显示检索或编年结果</span>
                </div>
                <div class="message-scroll" id="message-feed">
                  <div class="smart-results">
                    <div class="result-list" id="search-results"></div>
                    <div class="result-list" id="chronicle-results"></div>
                  </div>
                </div>
              </section>

              <section class="smart-dock" id="smart-dock" aria-label="全文检索与史事编年">
                <div class="smart-input-box">
                  <label class="sr-only" for="search-input">输入检索词或编年主题</label>
                  <textarea id="search-input" rows="3" placeholder="问书库：输入问题，系统会结合已整理文献回答"></textarea>
                  <input id="chronicle-topic" type="hidden" />
                  <div class="smart-actions">
                    <button class="chip-button active" id="chat-button" type="button" data-smart-mode="chat">对话</button>
                    <button class="chip-button" id="search-button" type="button" data-smart-mode="search">检索</button>
                    <button class="chip-button" id="build-chronicle" type="button" data-smart-mode="chronicle">编年</button>
                    <button class="round-send" id="smart-send" type="button" title="发送">↑</button>
                  </div>
                </div>
              </section>
            </div>

            <aside class="home-sidebar library-sidebar" aria-label="书库">
              <div class="sidebar-heading">
                <h2>文献库 <span class="sidebar-count" id="document-count">0 项在库</span></h2>
                <button class="ghost-link" id="jump-documents" type="button">全部 ›</button>
              </div>
              <section class="shelf-stage" aria-label="书架">
                <div class="document-list" id="document-list"></div>
              </section>
            </aside>
          </div>
        </section>

        <section class="view" id="documents-view" aria-label="文献库">
          <header class="documents-topbar">
            <div class="documents-nav">
              <button class="ghost-link" type="button" data-view="library">‹ 返回</button>
            </div>
            <div class="status-title">
              <p class="eyebrow">文献库</p>
            </div>
            <span class="documents-count" id="all-document-count">0 项在库</span>
          </header>

          <section class="shelf-stage documents-stage" aria-label="书架">
            <div class="document-list" id="all-document-list"></div>
          </section>

          <footer class="documents-bottombar" aria-label="文献库操作栏">
            <p class="documents-hint">长按文献可换序或删除</p>
          </footer>
        </section>

        <section class="view" id="reader-view" aria-label="文献浏览">
          <header class="reader-topbar">
            <button class="ghost-link" id="reader-back" type="button">‹ 返回</button>
            <div class="reader-title-block">
              <h2 id="reader-title">未选择文献</h2>
              <div class="reader-title-meta" id="reader-meta">
                <span id="reader-author">著者未录</span>
                <span id="reader-year">年份未录</span>
              </div>
            </div>
            <div class="reader-actions">
              <button class="ghost-link icon-text-button" id="export-document-pdf" type="button">
                导出
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  <path d="M14 2v6h6"></path>
                  <path d="M8 14h8"></path>
                  <path d="M8 18h5"></path>
                </svg>
              </button>
              <button class="ghost-link icon-text-button" id="edit-document" type="button">
                修改
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M12 20h9"></path>
                  <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path>
                </svg>
              </button>
            </div>
          </header>

          <div class="reader-layout">
            <section class="reader-main">
              <section class="panel reader-combined-panel">
                <div class="reader-compare">
                  <section class="reader-original-panel">
                    <div class="section-heading">
                      <h3>原始资料</h3>
                    </div>
                    <div class="reader-original-viewer" id="reader-original-preview"></div>
                  </section>

                  <section class="reader-text-panel">
                    <div class="section-heading reader-text-heading">
                      <h3>整理文本</h3>
                    </div>
                    <div class="reader-text" id="reader-text"></div>
                    <div class="reader-notes hidden" id="reader-notes"></div>
                  </section>
                </div>

                <div class="reader-nav-row">
                  <button class="ghost-link icon-text-button reader-page-button" id="reader-prev-page" type="button">
                    <svg aria-hidden="true" viewBox="0 0 24 24">
                      <path d="m15 18-6-6 6-6"></path>
                    </svg>
                    上一页
                  </button>
                  <label class="reader-page-jump" id="reader-page-status">
                    第
                    <input id="reader-page-input" type="number" min="1" value="1" inputmode="numeric" aria-label="当前页码">
                    <span id="reader-page-total">/ 0 页</span>
                  </label>
                  <button class="ghost-link icon-text-button reader-page-button" id="reader-next-page" type="button">
                    下一页
                    <svg aria-hidden="true" viewBox="0 0 24 24">
                      <path d="m9 18 6-6-6-6"></path>
                    </svg>
                  </button>
                </div>
              </section>
            </section>
          </div>
        </section>

        <section class="view" id="workspace-view" aria-label="整理工作台">
          <header class="workspace-topbar">
            <button class="back-button" type="button" data-view="reader">‹ 返回浏览</button>
            <div>
              <h2>文献整理</h2>
            </div>
          </header>

          <div class="workspace-grid">
            <section class="panel document-detail">
              <div class="section-heading">
                <h3>当前文献</h3>
                <span id="selected-status">未选择</span>
              </div>
              <dl id="document-detail"></dl>
              <div class="offline-actions hidden" id="offline-actions">
                <button class="primary-button" id="refresh-offline" type="button">刷新整本结果</button>
                <span class="inline-status" id="offline-status">等待处理</span>
              </div>

              <div class="progress-stack hidden" id="offline-progress">
                <div class="progress-row">
                  <span class="progress-label" id="offline-main-label">整本进度</span>
                  <div class="progress-track">
                    <div class="progress-fill" id="offline-main-fill"></div>
                  </div>
                  <span class="progress-value" id="offline-main-value">0 / 0 页</span>
                </div>
                <div class="progress-row">
                  <span class="progress-label" id="offline-sub-label">当前页</span>
                  <div class="progress-track">
                    <div class="progress-fill progress-fill-sub" id="offline-sub-fill"></div>
                  </div>
                  <span class="progress-value" id="offline-sub-value">等待</span>
                </div>
              </div>

              <div class="progress-stack hidden" id="online-progress">
                <div class="progress-row">
                  <span class="progress-label" id="online-main-label">在线整理进度</span>
                  <div class="progress-track">
                    <div class="progress-fill" id="online-main-fill"></div>
                  </div>
                  <span class="progress-value" id="online-main-value">0 / 0 页</span>
                </div>
                <div class="progress-row">
                  <span class="progress-label" id="online-sub-label">当前页</span>
                  <div class="progress-track">
                    <div class="progress-fill progress-fill-sub" id="online-sub-fill"></div>
                  </div>
                  <span class="progress-value" id="online-sub-value">等待</span>
                </div>
              </div>

              <div class="page-tools">
                <div class="section-heading compact-heading">
                  <h3>页目</h3>
                  <span id="page-count">0 页</span>
                </div>
                <div class="page-add-row">
                  <label>
                    页码
                    <input id="page-number-input" type="number" min="1" value="1" />
                  </label>
                  <button class="secondary-button" id="add-page" type="button">新增或打开</button>
                </div>
                <div class="page-batch-row">
                  <button class="secondary-button" id="generate-document-text" type="button">批量生成整理文本</button>
                </div>
                <div class="page-list" id="page-list"></div>
              </div>
            </section>

            <section class="compare-workspace">
              <section class="panel original-panel">
                <div class="section-heading">
                  <h3>本页原始资料</h3>
                  <span id="original-page-status">未选择页</span>
                </div>
                <label class="page-image-picker">
                  选择本页图片
                  <input id="page-image-input" type="file" accept="image/*" />
                </label>
                <div class="action-row">
                  <button class="primary-button" id="recognize-page" type="button">自动识别本页</button>
                  <span class="inline-status" id="recognize-status">等待原图</span>
                </div>
                <div class="original-viewer" id="original-preview"></div>
              </section>

              <section class="panel transcription-panel">
                <div class="section-heading">
                  <h3>本页文字整理</h3>
                  <span id="selected-page-status">未选择页</span>
                </div>
                <div class="page-nav-row">
                  <button class="secondary-button" id="prev-page" type="button">上一页</button>
                  <button class="secondary-button" id="next-page" type="button">下一页</button>
                  <button class="primary-button" id="save-next" type="button">保存并下一页</button>
                </div>
                <label class="text-layer">
                  OCR 原始录文
                  <textarea id="ocr-raw-text" class="layer-textarea" rows="7" placeholder="自动识别结果会先进入这里。这里保留原始识别文本，不直接作为最终整理稿。"></textarea>
                </label>
                <div class="layer-tools">
                  <button class="secondary-button" id="copy-ocr-to-clean" type="button">带入整理文本</button>
                </div>
                <label class="text-layer">
                  忠实整理文本
                  <textarea id="clean-text" class="layer-textarea" rows="7" placeholder="自动整理结果会进入这里，也可直接人工编辑。"></textarea>
                </label>
                <div class="layer-tools">
                  <button class="secondary-button" id="copy-clean-to-punctuated" type="button">带入简体标点文本</button>
                  <button class="primary-button" id="generate-punctuated" type="button">生成简体标点文本</button>
                </div>
                <label class="text-layer">
                  简体标点文本
                  <textarea id="punctuated-text" class="layer-textarea" rows="7" placeholder="在忠实整理文本基础上转换简体、断句、加标点，便于阅读、检索和编年。"></textarea>
                </label>
                <label>
                  页备注
                  <textarea id="page-notes" class="notes-textarea" rows="5" placeholder="可记录本页不确定字、残缺处或个人研究备注。"></textarea>
                </label>
                <div class="action-row">
                  <button class="primary-button" id="save-ocr" type="button">保存本页</button>
                  <button class="secondary-button" id="generate-final-text" type="button">生成整理文本</button>
                  <span class="inline-status" id="llm-task-status">等待文字</span>
                </div>
              </section>
            </section>
          </div>
        </section>
      </main>
    </div>

    <div class="confirm-dialog hidden" id="delete-conversation-dialog" role="dialog" aria-modal="true" aria-labelledby="delete-conversation-title">
      <div class="confirm-card">
        <h2 id="delete-conversation-title">删除对话</h2>
        <p id="delete-conversation-message">确定删除这条对话吗？</p>
        <div class="confirm-actions">
          <button class="secondary-button" id="cancel-delete-conversation" type="button">取消</button>
          <button class="danger-button" id="confirm-delete-conversation" type="button">删除</button>
        </div>
      </div>
    </div>

    <div class="form-sheet hidden" id="document-form-sheet" role="dialog" aria-modal="true" aria-labelledby="add-document-title">
      <form class="panel form-panel" id="document-form">
        <div class="section-heading">
          <h3 id="add-document-title">新增文献</h3>
          <button class="icon-button subtle" id="close-document-form" type="button" title="关闭">×</button>
        </div>
        <label class="file-picker-row">
          <span class="sr-only">选择 PDF 或图片文件</span>
          <input id="file-input" name="file" type="file" accept=".pdf,image/*" required />
        </label>
        <section class="info-field" aria-labelledby="document-info-title">
          <div class="info-field-heading">
            <span id="document-info-title">信息</span>
            <span>可留空会自动识别</span>
          </div>
          <label>
            文献名
            <input id="title-input" name="title" type="text" />
          </label>
          <div class="field-grid metadata-grid">
            <label>
              著者
              <input id="author-input" name="author" type="text" />
            </label>
            <label>
              出版社
              <input id="publisher-input" name="publisher" type="text" />
            </label>
            <label>
              年份
              <input id="year-input" name="year" type="text" />
            </label>
          </div>
        </section>
        <label>
          标签
          <input id="tags-input" name="tags" type="text" placeholder="以逗号分隔" />
        </label>
        <fieldset class="mode-field">
          <legend>处理方式</legend>
          <div class="mode-options">
            <label class="radio-row">
              <input type="radio" name="processMode" value="offline" checked />
              离线整本处理
            </label>
            <label class="radio-row">
              <input type="radio" name="processMode" value="online" />
              在线逐页整理
            </label>
          </div>
        </fieldset>
        <button class="primary-button" type="submit">登记</button>
      </form>
    </div>

    <template id="document-card-template">
      <article class="book-card">
        <button class="book-open select-document" type="button">
          <span class="book-cover">
            <span class="book-title"></span>
            <span class="book-facts">
              <span class="book-year"></span>
              <span class="book-pages"></span>
            </span>
            <span class="book-author"></span>
          </span>
        </button>
      </article>
    </template>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/store.js"></script>
    <script src="js/dom.js"></script>
    <script src="js/render.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/service.js"></script>
    <script src="js/ocr.js"></script>
    <script src="js/llm.js"></script>
    <script src="js/search.js"></script>
    <script src="js/chronicle.js"></script>
    <script src="js/export.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
