<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>近代军史数智平台</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <main class="main">
        <section class="view active" id="library-view" aria-label="首页">
          <header class="home-statusbar">
            <div class="service-strip" aria-label="服务链接状态">
              <span>OCR：<b id="ocr-service-status" class="service-warn">未连接</b></span>
              <span>大模型：<b id="llm-service-status" class="service-warn">未连接</b></span>
            </div>
            <div class="status-title">
              <p class="eyebrow">近代军史数智平台</p>
            </div>
            <div class="status-spacer" aria-hidden="true"></div>
          </header>

          <div class="home-board">
            <aside class="home-sidebar chat-sidebar" aria-label="对话记录">
              <div class="sidebar-heading">
                <h2>对话记录</h2>
                <button class="ghost-link" id="new-conversation" type="button">新建 ＋</button>
              </div>
              <div class="conversation-list" id="conversation-list"></div>
            </aside>

            <div class="center-stack">
              <section class="message-panel" aria-label="书库问答消息">
                <div class="message-head">
                  <h2 id="chat-title">新对话</h2>
                  <span id="chat-hint">输入后在这里显示检索或编年结果</span>
                </div>
                <div class="message-scroll" id="message-feed">
                  <div class="smart-results">
                    <div class="result-list" id="search-results"></div>
                    <div class="result-list" id="chronicle-results"></div>
                  </div>
                </div>
              </section>

              <section class="smart-dock" id="smart-dock" aria-label="全文检索与史事编年">
                <div class="smart-input-box">
                  <label class="sr-only" for="search-input">输入检索词或编年主题</label>
                  <textarea id="search-input" rows="3" placeholder="问书库：输入问题，系统会结合已整理文献回答"></textarea>
                  <input id="chronicle-topic" type="hidden" />
                  <div class="smart-actions">
                    <button class="chip-button active" id="chat-button" type="button" data-smart-mode="chat">对话</button>
                    <button class="chip-button" id="search-button" type="button" data-smart-mode="search">检索</button>
                    <button class="chip-button" id="build-chronicle" type="button" data-smart-mode="chronicle">编年</button>
                    <button class="round-send" id="smart-send" type="button" title="发送">↑</button>
                  </div>
                </div>
              </section>
            </div>

            <aside class="home-sidebar library-sidebar" aria-label="书库">
              <div class="sidebar-heading">
                <h2>文献库 <span class="sidebar-count" id="document-count">0 项在库</span></h2>
                <button class="ghost-link" id="jump-documents" type="button">全部 ›</button>
              </div>
              <section class="shelf-stage" aria-label="书架">
                <div class="document-list" id="document-list"></div>
              </section>
            </aside>
          </div>
        </section>

        <section class="view" id="documents-view" aria-label="文献库">
          <header class="documents-topbar">
            <div class="documents-nav">
              <button class="ghost-link" type="button" data-view="library">‹ 返回</button>
            </div>
            <div class="status-title">
              <p class="eyebrow">文献库</p>
            </div>
            <span class="documents-count" id="all-document-count">0 项在库</span>
          </header>

          <section class="shelf-stage documents-stage" aria-label="书架">
            <div class="document-list" id="all-document-list"></div>
          </section>

          <footer class="documents-bottombar" aria-label="文献库操作栏"></footer>
        </section>

        <section class="view" id="workspace-view" aria-label="整理工作台">
          <header class="workspace-topbar">
            <button class="back-button" type="button" data-view="library">‹ 返回书库</button>
            <div>
              <p class="eyebrow">当前整理台</p>
              <h2>文献整理</h2>
            </div>
          </header>

          <div class="workspace-grid">
            <section class="panel document-detail">
              <div class="section-heading">
                <h3>当前文献</h3>
                <span id="selected-status">未选择</span>
              </div>
              <dl id="document-detail"></dl>
              <div class="offline-actions hidden" id="offline-actions">
                <button class="primary-button" id="refresh-offline" type="button">刷新整本结果</button>
                <span class="inline-status" id="offline-status">等待处理</span>
              </div>

              <div class="page-tools">
                <div class="section-heading compact-heading">
                  <h3>页目</h3>
                  <span id="page-count">0 页</span>
                </div>
                <div class="page-add-row">
                  <label>
                    页码
                    <input id="page-number-input" type="number" min="1" value="1" />
                  </label>
                  <button class="secondary-button" id="add-page" type="button">新增或打开</button>
                </div>
                <div class="page-list" id="page-list"></div>
              </div>
            </section>

            <section class="compare-workspace">
              <section class="panel original-panel">
                <div class="section-heading">
                  <h3>本页原始资料</h3>
                  <span id="original-page-status">未选择页</span>
                </div>
                <label class="page-image-picker">
                  选择本页图片
                  <input id="page-image-input" type="file" accept="image/*" />
                </label>
                <div class="action-row">
                  <button class="primary-button" id="recognize-page" type="button">自动识别本页</button>
                  <span class="inline-status" id="recognize-status">等待原图</span>
                </div>
                <div class="original-viewer" id="original-preview"></div>
              </section>

              <section class="panel transcription-panel">
                <div class="section-heading">
                  <h3>本页文字整理</h3>
                  <span id="selected-page-status">未选择页</span>
                </div>
                <div class="page-nav-row">
                  <button class="secondary-button" id="prev-page" type="button">上一页</button>
                  <button class="secondary-button" id="next-page" type="button">下一页</button>
                  <button class="primary-button" id="save-next" type="button">保存并下一页</button>
                </div>
                <label class="text-layer">
                  OCR 原始录文
                  <textarea id="ocr-raw-text" class="layer-textarea" rows="7" placeholder="自动识别结果会先进入这里。这里保留原始识别文本，不直接作为最终整理稿。"></textarea>
                </label>
                <div class="layer-tools">
                  <button class="secondary-button" id="copy-ocr-to-clean" type="button">带入整理文本</button>
                </div>
                <label class="text-layer">
                  忠实整理文本
                  <textarea id="clean-text" class="layer-textarea" rows="7" placeholder="在原始录文基础上逐字核对、修正识别错误，保持原文原貌。"></textarea>
                </label>
                <div class="layer-tools">
                  <button class="secondary-button" id="copy-clean-to-punctuated" type="button">带入简体标点文本</button>
                  <button class="primary-button" id="generate-punctuated" type="button">生成简体标点文本</button>
                </div>
                <label class="text-layer">
                  简体标点文本
                  <textarea id="punctuated-text" class="layer-textarea" rows="7" placeholder="在忠实整理文本基础上转换简体、断句、加标点，便于阅读、检索和编年。"></textarea>
                </label>
                <label>
                  疑难字与核对说明
                  <textarea id="page-notes" class="notes-textarea" rows="5" placeholder="可记录本页不确定字、残缺处、需回看原图的位置，例如：第3行第5字待核。"></textarea>
                </label>
                <div class="action-row">
                  <button class="primary-button" id="save-ocr" type="button">保存本页</button>
                  <button class="secondary-button" id="mark-reviewed" type="button">标记待核对</button>
                  <button class="secondary-button" id="generate-proofread" type="button">生成校对报告</button>
                  <span class="inline-status" id="llm-task-status">等待文字</span>
                </div>
              </section>
            </section>
          </div>
        </section>
      </main>
    </div>

    <div class="confirm-dialog hidden" id="delete-conversation-dialog" role="dialog" aria-modal="true" aria-labelledby="delete-conversation-title">
      <div class="confirm-card">
        <h2 id="delete-conversation-title">删除对话</h2>
        <p id="delete-conversation-message">确定删除这条对话吗？</p>
        <div class="confirm-actions">
          <button class="secondary-button" id="cancel-delete-conversation" type="button">取消</button>
          <button class="danger-button" id="confirm-delete-conversation" type="button">删除</button>
        </div>
      </div>
    </div>

    <div class="form-sheet hidden" id="document-form-sheet" role="dialog" aria-modal="true" aria-labelledby="add-document-title">
      <form class="panel form-panel" id="document-form">
        <div class="section-heading">
          <h3 id="add-document-title">新增文献</h3>
          <button class="icon-button subtle" id="close-document-form" type="button" title="关闭">×</button>
        </div>
        <label>
          <span class="sr-only">选择 PDF 或图片文件</span>
          <input id="file-input" name="file" type="file" accept=".pdf,image/*" required />
        </label>
        <label>
          文献名
          <input id="title-input" name="title" type="text" placeholder="可留空，系统会优先自动识别" />
        </label>
        <div class="field-grid">
          <label>
            著者
            <input id="author-input" name="author" type="text" placeholder="可留空" />
          </label>
          <label>
            年份
            <input id="year-input" name="year" type="text" placeholder="可留空" />
          </label>
        </div>
        <div class="field-grid">
          <label>
            出版社
            <input id="publisher-input" name="publisher" type="text" placeholder="可留空" />
          </label>
          <label>
            版权信息
            <input id="rights-input" name="rights" type="text" placeholder="可留空" />
          </label>
        </div>
        <label>
          来源信息
          <input id="source-input" name="source" type="text" placeholder="可留空" />
        </label>
        <label>
          主题标签
          <input id="tags-input" name="tags" type="text" placeholder="以逗号分隔" />
        </label>
        <fieldset class="mode-field">
          <legend>处理方式</legend>
          <label class="radio-row">
            <input type="radio" name="processMode" value="online" checked />
            在线逐页整理
          </label>
          <label class="radio-row">
            <input type="radio" name="processMode" value="offline" />
            离线整本处理
          </label>
        </fieldset>
        <button class="primary-button" type="submit">登记并进入整理台</button>
      </form>
    </div>

    <template id="document-card-template">
      <article class="book-card">
        <button class="book-open select-document" type="button">
          <span class="book-cover">
            <span class="book-title"></span>
            <span class="book-facts">
              <span class="book-year"></span>
              <span class="book-pages"></span>
            </span>
            <span class="book-author"></span>
          </span>
        </button>
      </article>
    </template>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/store.js"></script>
    <script src="js/dom.js"></script>
    <script src="js/render.js"></script>
    <script src="js/service-status.js"></script>
    <script src="js/ocr.js"></script>
    <script src="js/llm.js"></script>
    <script src="js/search.js"></script>
    <script src="js/chronicle.js"></script>
    <script src="js/export.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
