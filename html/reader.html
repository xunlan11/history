<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>文献浏览 · 近代军史数智平台</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body data-page="reader">
    <div class="app-shell">
      <main class="main">
        <section class="view active" id="reader-view" aria-label="文献浏览">
          <header class="reader-topbar">
            <button class="ghost-link" id="reader-back" type="button">‹ 返回</button>
            <div class="reader-title-block">
              <h2 id="reader-title">未选择文献</h2>
            </div>
            <div class="reader-actions">
              <button class="ghost-link icon-text-button" id="export-document-pdf" type="button">
                导出
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  <path d="M14 2v6h6"></path>
                  <path d="M8 14h8"></path>
                  <path d="M8 18h5"></path>
                </svg>
              </button>
            </div>
          </header>

          <div class="reader-layout" id="reader-layout">
            <div class="reader-sidebar-stack" id="reader-sidebar-stack">
              <aside class="panel reader-sidebar" aria-label="文献信息">
                <div class="section-heading reader-detail-heading">
                  <h3>文献信息</h3>
                  <span class="reader-detail-actions" id="reader-detail-actions"></span>
                </div>
                <dl id="reader-document-detail"></dl>
                <span class="inline-status" id="reader-stream-status">等待处理</span>
              </aside>
              <section class="panel reader-progress-panel" aria-label="处理进度">
                <div class="reader-progress-area">
                  <div class="progress-stack hidden" id="reader-stream-progress">
                    <div class="progress-header">
                      <div class="progress-heading">
                        <span class="progress-title">处理进度</span>
                        <span class="progress-mode" data-progress-mode>串行</span>
                      </div>
                      <div class="progress-header-tools" aria-label="各阶段每页处理进度">
                        <div class="progress-stage-ring-item" data-progress-stage="ocr" title="文字识别">
                          <div class="progress-ring" aria-hidden="true"><svg viewBox="0 0 36 36"><circle class="progress-ring-track" cx="18" cy="18" r="15.5"></circle><circle class="progress-ring-fill progress-ring-fill-ocr" cx="18" cy="18" r="15.5" data-progress-ring></circle></svg><span class="progress-ring-label">识别</span><span class="progress-ring-count"><b data-progress-pages>0</b></span></div>
                        </div>
                        <div class="progress-stage-ring-item" data-progress-stage="variant" title="简繁转换">
                          <div class="progress-ring" aria-hidden="true"><svg viewBox="0 0 36 36"><circle class="progress-ring-track" cx="18" cy="18" r="15.5"></circle><circle class="progress-ring-fill progress-ring-fill-variant" cx="18" cy="18" r="15.5" data-progress-ring></circle></svg><span class="progress-ring-label">简繁</span><span class="progress-ring-count"><b data-progress-pages>0</b></span></div>
                        </div>
                        <div class="progress-stage-ring-item" data-progress-stage="punctuation" title="标点符号">
                          <div class="progress-ring" aria-hidden="true"><svg viewBox="0 0 36 36"><circle class="progress-ring-track" cx="18" cy="18" r="15.5"></circle><circle class="progress-ring-fill progress-ring-fill-punctuation" cx="18" cy="18" r="15.5" data-progress-ring></circle></svg><span class="progress-ring-label">标点</span><span class="progress-ring-count"><b data-progress-pages>0</b></span></div>
                        </div>
                        <div class="progress-stage-ring-item" data-progress-stage="proofreading" title="校对">
                          <div class="progress-ring" aria-hidden="true"><svg viewBox="0 0 36 36"><circle class="progress-ring-track" cx="18" cy="18" r="15.5"></circle><circle class="progress-ring-fill progress-ring-fill-proofreading" cx="18" cy="18" r="15.5" data-progress-ring></circle></svg><span class="progress-ring-label">校对</span><span class="progress-ring-count"><b data-progress-pages>0</b></span></div>
                        </div>
                      </div>
                    </div>
                    <div class="progress-bar-row">
                      <div class="progress-track progress-track-main" aria-label="四阶段合并进度">
                        <div class="progress-fill progress-fill-ocr" data-progress-fill="ocr"></div>
                        <div class="progress-fill progress-fill-variant" data-progress-fill="variant"></div>
                        <div class="progress-fill progress-fill-punctuation" data-progress-fill="punctuation"></div>
                        <div class="progress-fill progress-fill-proofreading" data-progress-fill="proofreading"></div>
                      </div>
                      <span class="progress-total" title="总页数"><b data-progress-total>0</b></span>
                    </div>
                    <div class="processing-failed hidden" data-progress-failed>
                      <span class="processing-failed-title">失败页</span>
                      <div class="processing-failed-pages" data-progress-failed-pages></div>
                    </div>
                  </div>
                </div>
              </section>
              <section class="panel reader-search-panel" id="reader-search-panel" aria-labelledby="reader-search-title">
                <div class="section-heading"><h3 id="reader-search-title">文内检索</h3></div>
                <form class="reader-search-form" id="reader-search-form" role="search">
                  <label class="sr-only" for="reader-search-input">检索当前文献的整理文本</label>
                  <input id="reader-search-input" type="search" maxlength="2000" autocomplete="off" />
                  <button class="secondary-button" type="submit" id="reader-search-submit">检索</button>
                </form>
                <div class="reader-search-action-row">
                  <div class="reader-search-nav-group">
                    <button class="reader-search-nav-button" type="button" data-reader-search-nav="first">首项</button>
                    <button class="reader-search-nav-button" type="button" data-reader-search-nav="last">末项</button>
                  </div>
                  <div class="reader-search-nav-group">
                    <button class="reader-search-nav-button" type="button" data-reader-search-nav="prev">上一项</button>
                    <button class="reader-search-nav-button" type="button" data-reader-search-nav="next">下一项</button>
                  </div>
                  <button class="reader-search-mark-button" id="reader-search-mark-all" type="button" aria-pressed="false">标注</button>
                </div>
                <div class="reader-search-filter-row">
                  <fieldset class="reader-search-filters">
                    <legend class="sr-only">筛选匹配层级，可任选零至三个层级</legend>
                    <label><input type="checkbox" data-reader-search-level="exact" checked /><span class="reader-search-level-exact">严格</span> <span data-reader-search-count="exact">0</span></label>
                    <label><input type="checkbox" data-reader-search-level="partial" checked /><span class="reader-search-level-partial">部分</span> <span data-reader-search-count="partial">0</span></label>
                    <label><input type="checkbox" data-reader-search-level="semantic" checked /><span class="reader-search-level-semantic">嵌入</span> <span data-reader-search-count="semantic">0</span></label>
                  </fieldset>
                  <fieldset class="reader-search-page-range">
                    <legend class="sr-only">按页码筛选结果，留空表示不限制</legend>
                    <span>第</span>
                    <input id="reader-search-page-from" type="number" min="1" step="1" inputmode="numeric" aria-label="起始页码" />
                    <span>-</span>
                    <input id="reader-search-page-to" type="number" min="1" step="1" inputmode="numeric" aria-label="终止页码" />
                    <span>页</span>
                  </fieldset>
                </div>
                <p class="reader-search-status" id="reader-search-status" role="status" aria-live="polite"></p>
                <ol class="reader-search-results" id="reader-search-results" aria-label="匹配结果，按文中位置排序"></ol>
              </section>
            </div>
            <section class="reader-main">
              <button class="icon-button reader-panel-toggle reader-sidebar-toggle" id="reader-sidebar-toggle" type="button" aria-label="折叠工具栏" aria-controls="reader-sidebar-stack" aria-expanded="true">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg>
              </button>
              <section class="panel reader-combined-panel">
                <div class="reader-compare" id="reader-compare">
                  <div class="section-heading reader-original-heading">
                    <h3>原始资料</h3>
                    <button class="icon-button reader-panel-toggle" id="reader-original-toggle" type="button" aria-label="折叠原始资料" aria-controls="reader-original-preview" aria-expanded="true">
                      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg>
                    </button>
                  </div>
                  <div class="section-heading reader-text-heading">
                    <h3>整理文本</h3>
                    <button class="ghost-link icon-text-button" id="edit-document" type="button">
                      <span id="edit-document-label">修改</span>
                      <svg aria-hidden="true" viewBox="0 0 24 24">
                        <path d="M12 20h9"></path>
                        <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path>
                      </svg>
                    </button>
                  </div>
                  <div class="section-heading reader-annotation-heading">
                    <span class="reader-annotation-status" id="reader-annotation-status" aria-live="polite"></span>
                    <h3>笺注</h3>
                    <button class="icon-button reader-panel-toggle" id="reader-annotation-toggle" type="button" aria-label="折叠笺注" aria-controls="reader-annotation" aria-expanded="true">
                      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"></path></svg>
                    </button>
                  </div>

                  <section class="reader-original-panel" id="reader-original-panel">
                    <div class="reader-original-viewer" id="reader-original-preview"></div>
                  </section>

                  <section class="reader-text-panel">
                    <div class="reader-text" id="reader-text"></div>
                    <div class="reader-notes hidden" id="reader-notes"></div>
                  </section>

                  <section class="reader-annotation-panel" id="reader-annotation-panel">
                    <label class="sr-only" for="reader-annotation">本页笺注</label>
                    <textarea class="reader-annotation" id="reader-annotation" maxlength="100000" placeholder="在此记录本页笺注" spellcheck="true"></textarea>
                  </section>
                </div>

                <div class="reader-nav-row">
                  <button class="ghost-link icon-text-button reader-page-button" id="reader-prev-page" type="button">
                    <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg>
                    上一页
                  </button>
                  <label class="reader-page-jump" id="reader-page-status">
                    第
                    <input id="reader-page-input" type="number" min="1" value="1" inputmode="numeric" aria-label="当前页码" />
                    <span id="reader-page-total">/ 0 页</span>
                  </label>
                  <button class="ghost-link icon-text-button reader-page-button" id="reader-next-page" type="button">
                    下一页
                    <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"></path></svg>
                  </button>
                </div>
              </section>
            </section>
          </div>
        </section>
      </main>
    </div>

    <script src="../js/core.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/variant.js"></script>
    <script src="../js/retrieval.js"></script>
    <script src="../js/reader.js"></script>
    <script src="../js/reader-search.js"></script>
    <script src="../js/documents.js"></script>
    <script src="../js/processing.js"></script>
    <script src="../js/registration.js"></script>
    <script src="../js/service.js"></script>
    <script src="../js/export.js"></script>
    <script src="../js/main.js"></script>
  </body>
</html>
