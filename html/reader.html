<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>文献浏览 · 近代军史数智平台</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body data-page="reader">
    <div class="app-shell">
      <main class="main">
        <section class="view active" id="reader-view" aria-label="文献浏览">
          <header class="reader-topbar">
            <button class="ghost-link" id="reader-back" type="button">�?返回</button>
            <div class="reader-title-block">
              <h2 id="reader-title">未选择文献</h2>
              <div class="reader-title-meta" id="reader-meta">
                <span id="reader-author">著者未�?/span>
                <span id="reader-year">年份未录</span>
              </div>
            </div>
            <div class="reader-actions">
              <button class="ghost-link icon-text-button" id="export-document-pdf" type="button">
                导出
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  <path d="M14 2v6h6"></path>
                  <path d="M8 14h8"></path>
                  <path d="M8 18h5"></path>
                </svg>
              </button>
              <button class="ghost-link icon-text-button" id="edit-document" type="button">
                <span id="edit-document-label">修改</span>
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M12 20h9"></path>
                  <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path>
                </svg>
              </button>
            </div>
          </header>

          <div class="reader-layout">
            <aside class="panel reader-sidebar" aria-label="文献信息与页目录">
              <div class="section-heading reader-sidebar-heading">
                <h3>当前文献</h3>
                <div class="reader-sidebar-status">
                  <span id="reader-selected-status">未选择</span>
                  <button class="icon-button refresh-stream-button hidden" id="refresh-stream" type="button" aria-label="刷新处理结果" title="刷新处理结果">
                    <svg aria-hidden="true" viewBox="0 0 24 24">
                      <path d="M20 11a8.1 8.1 0 0 0-14.7-4L3 10"></path>
                      <path d="M3 5v5h5"></path>
                      <path d="M4 13a8.1 8.1 0 0 0 14.7 4L21 14"></path>
                      <path d="M21 19v-5h-5"></path>
                    </svg>
                  </button>
                </div>
              </div>
              <dl id="reader-document-detail"></dl>
              <span class="inline-status" id="reader-stream-status">等待处理</span>
              <div class="progress-stack hidden" id="reader-stream-progress">
                <div class="progress-row"><span class="progress-label" id="reader-stream-main-label">逐页处理进度</span><div class="progress-track"><div class="progress-fill" id="reader-stream-main-fill"></div></div><span class="progress-value" id="reader-stream-main-value">0 / 0 �?/span></div>
                <div class="progress-row"><span class="progress-label" id="reader-stream-sub-label">当前�?/span><div class="progress-track"><div class="progress-fill progress-fill-sub" id="reader-stream-sub-fill"></div></div><span class="progress-value" id="reader-stream-sub-value">等待</span></div>
              </div>
              <div class="page-tools">
                <div class="section-heading compact-heading"><h3>页目�?/h3><span id="reader-page-count">0 �?/span></div>
                <div class="page-list" id="reader-page-list"></div>
              </div>
            </aside>
            <section class="reader-main">
              <section class="panel reader-combined-panel">
                <div class="reader-compare">
                  <section class="reader-original-panel">
                    <div class="section-heading">
                      <h3>原始资料</h3>
                    </div>
                    <div class="reader-original-viewer" id="reader-original-preview"></div>
                  </section>

                  <section class="reader-text-panel">
                    <div class="section-heading reader-text-heading">
                      <h3>整理文本</h3>
                    </div>
                    <div class="reader-text" id="reader-text"></div>
                    <div class="reader-notes hidden" id="reader-notes"></div>
                  </section>
                </div>

                <div class="reader-nav-row">
                  <button class="ghost-link icon-text-button reader-page-button" id="reader-prev-page" type="button">
                    <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg>
                    上一�?                  </button>
                  <label class="reader-page-jump" id="reader-page-status">
                    �?                    <input id="reader-page-input" type="number" min="1" value="1" inputmode="numeric" aria-label="当前页码" />
                    <span id="reader-page-total">/ 0 �?/span>
                  </label>
                  <button class="ghost-link icon-text-button reader-page-button" id="reader-next-page" type="button">
                    下一�?                    <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"></path></svg>
                  </button>
                </div>
              </section>
            </section>
          </div>
        </section>
      </main>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/store.js"></script>
    <script src="../js/dom.js"></script>
    <script src="../js/render.js"></script>
    <script src="../js/progress.js"></script>
    <script src="../js/service.js"></script>
    <script src="../js/ocr.js"></script>
    <script src="../js/llm.js"></script>
    <script src="../js/export.js"></script>
    <script src="../js/main.js"></script>
  </body>
</html>
