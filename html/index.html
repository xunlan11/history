<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>近代军史数智平台</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body data-page="library">
    <div class="app-shell">
      <main class="main">
        <section class="view active" id="library-view" aria-label="首页">
          <header class="home-statusbar">
            <div class="service-strip" aria-label="服务链接状态">
              <span class="service-item service-item-version">
                版本：<b id="version-service-status" class="service-warn">检查中</b>
                <button class="status-action hidden" id="version-update-button" type="button">更新</button>
              </span>
              <span class="service-item">OCR：<b id="ocr-service-status" class="service-warn">未连接</b></span>
              <span class="service-item service-item-llm">大模型：<b id="llm-service-status" class="service-warn">未连接</b></span>
            </div>
            <div class="status-title">
              <p class="eyebrow" id="home-site-title">近代军史数智平台</p>
            </div>
            <div class="home-topbar-actions">
              <div id="auth-slot"></div>
              <button class="ghost-link settings-button icon-text-button" id="open-settings" type="button" aria-haspopup="dialog" aria-controls="settings-dialog">
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.5a2 2 0 0 1-1 1.73l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.73v-.5a2 2 0 0 1 1-1.72l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                设置
              </button>
            </div>
          </header>

          <div class="home-board">
            <aside class="home-sidebar chat-sidebar" aria-label="对话记录">
              <div class="sidebar-heading">
                <h2>对话记录</h2>
                <button class="ghost-link" id="new-conversation" type="button">新建 ＋</button>
              </div>
              <div class="conversation-list" id="conversation-list"></div>
            </aside>

            <div class="center-stack">
              <section class="message-panel" aria-label="书库问答消息">
                <div class="message-head">
                  <h2 id="chat-title">新对话</h2>
                  <span id="chat-hint">对话类型</span>
                </div>
                <div class="message-scroll" id="message-feed">
                  <div class="smart-results">
                    <div class="result-list" id="search-results"></div>
                    <div class="result-list" id="chronicle-results"></div>
                  </div>
                </div>
              </section>

              <section class="smart-dock" id="smart-dock" aria-label="全文检索与史事编年">
                <div class="smart-input-box">
                  <div class="reference-context" aria-label="当前对话参考文献">
                    <input
                      class="hidden"
                      id="conversation-file-input"
                      type="file"
                      multiple
                      accept=".pdf,.docx,.xlsx,.pptx,.odt,.ods,.rtf,.txt,.md,.markdown,.csv,.tsv,.json,.jsonl,.xml,.html,.htm,.yaml,.yml,.log,.png,.jpg,.jpeg,.webp,.bmp,.tif,.tiff"
                    />
                    <div class="reference-chips" id="reference-document-chips"></div>
                    <div class="reference-chips" id="conversation-attachment-chips"></div>
                  </div>
                  <p class="reference-scope-status hidden" id="reference-scope-status" role="status"></p>
                  <p class="reference-scope-status hidden" id="conversation-attachment-status" role="status"></p>
                  <label class="sr-only" for="search-input">输入检索词或编年主题</label>
                  <textarea id="search-input" rows="3" placeholder="问书库：输入问题，系统会结合已整理文献回答"></textarea>
                  <input id="chronicle-topic" type="hidden" />
                  <div class="smart-actions">
                    <button class="chip-button active" id="chat-button" type="button" data-smart-mode="chat">对话</button>
                    <button class="chip-button" id="search-button" type="button" data-smart-mode="search">检索</button>
                    <button class="chip-button" id="build-chronicle" type="button" data-smart-mode="chronicle">编年</button>
                    <button class="reference-trigger" id="open-reference-documents" type="button">
                      ＋ 导入文献
                      <span class="reference-trigger-count hidden" id="reference-document-count"></span>
                    </button>
                    <button class="reference-trigger" id="upload-conversation-files" type="button">↑ 上传文件</button>
                    <button class="round-send" id="smart-send" type="button" title="发送">↑</button>
                  </div>
                </div>
              </section>
            </div>

            <aside class="home-sidebar library-sidebar" aria-label="书库">
              <div class="sidebar-heading">
                <h2>文献库 <span class="sidebar-count" id="document-count">0 项在库</span></h2>
                <button class="ghost-link" id="jump-documents" type="button">全部 ›</button>
              </div>
              <div id="document-shelf-slot" data-list-id="document-list" data-stage-class="shelf-stage"></div>
            </aside>
          </div>
        </section>
      </main>
    </div>

    <div id="delete-fragment-slot" data-title="删除内容"></div>

    <div id="settings-fragment-slot"></div>

    <div id="reference-documents-fragment-slot"></div>

    <div id="registration-fragment-slot"></div>
    <script src="../js/bootstrap.js"></script>
  </body>
</html>
