<div class="settings-dialog hidden" id="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settings-title">
  <section class="settings-card">
    <header class="settings-header">
      <h2 id="settings-title">设置</h2>
      <button class="icon-button subtle" id="close-settings" type="button" aria-label="关闭">×</button>
    </header>
    <div class="settings-field">
      <span class="settings-field-label">字体</span>
      <div class="font-options" role="group" aria-label="字体">
        <button class="font-option" type="button" data-font-option="hei">黑体</button>
        <button class="font-option" type="button" data-font-option="kai">楷体</button>
      </div>
    </div>
  </section>
</div>
