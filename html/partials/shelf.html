<section class="shelf-stage" data-shelf-stage aria-label="书架">
  <div class="shelf-toolbar">
    <nav class="shelf-path" aria-label="文件夹位置">
      <button type="button" class="shelf-root" data-shelf-root>文献库</button>
      <span class="shelf-current" data-shelf-current hidden></span>
    </nav>
    <div class="shelf-folder-actions">
      <button type="button" data-shelf-add>＋ 新增文献</button>
      <button type="button" data-shelf-create>＋ 新建文件夹</button>
      <button type="button" data-shelf-rename hidden>重命名</button>
      <button type="button" data-shelf-dissolve hidden>解散文件夹</button>
    </div>
  </div>
  <p class="shelf-hint" data-shelf-hint></p>
  <dialog class="shelf-name-dialog" id="shelf-name-dialog" aria-labelledby="shelf-name-title">
    <form>
      <h2 id="shelf-name-title">新建文件夹</h2>
      <label for="shelf-name-input">文件夹名称</label>
      <input id="shelf-name-input" type="text" maxlength="80" required autocomplete="off" placeholder="例如：晚清军事史" />
      <div class="shelf-name-actions">
        <button type="button" data-shelf-name-cancel>取消</button>
        <button type="submit">保存</button>
      </div>
    </form>
  </dialog>
  <div class="document-list" data-shelf-list></div>

  <template id="document-card-template">
    <article class="book-card">
      <button class="book-open select-document" type="button">
        <span class="book-cover">
          <span class="book-title"></span>
          <span class="book-facts">
            <span class="book-year"></span>
            <span class="book-pages"></span>
          </span>
          <span class="book-author"></span>
        </span>
      </button>
    </article>
  </template>
</section>
