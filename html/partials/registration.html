<div class="form-sheet hidden" id="document-form-sheet" role="dialog" aria-modal="true" aria-labelledby="add-document-title">
  <form class="panel form-panel" id="document-form">
    <div class="section-heading">
      <h3 id="add-document-title">新增文献</h3>
      <button class="icon-button subtle" id="close-document-form" type="button" title="关闭">×</button>
    </div>
    <label class="file-picker-row">
      <span class="sr-only">选择 PDF 或图片文件</span>
      <input id="file-input" name="file" type="file" accept=".pdf,image/*" required />
    </label>
    <section class="info-field" aria-labelledby="document-info-title">
      <div class="info-field-heading">
        <span id="document-info-title">信息</span>
        <span>可留空，会自动识别</span>
      </div>
      <label>
        文献名
        <input id="title-input" name="title" type="text" />
      </label>
      <div class="field-grid metadata-grid">
        <label>
          著者
          <input id="author-input" name="author" type="text" />
        </label>
        <label>
          出版社
          <input id="publisher-input" name="publisher" type="text" />
        </label>
        <label>
          出版时间
          <input id="year-input" name="year" type="text" />
        </label>
      </div>
    </section>
    <label>
      标签
      <input id="tags-input" name="tags" type="text" placeholder="以逗号分隔" />
    </label>
    <fieldset class="processing-mode-field">
      <legend>处理方式</legend>
      <div class="processing-mode-options">
        <label class="processing-mode-option">
          <input type="radio" name="processingMode" value="serial" checked />
          <span>串行</span>
        </label>
        <label class="processing-mode-option">
          <input type="radio" name="processingMode" value="parallel" />
          <span>并行</span>
        </label>
      </div>
    </fieldset>
    <button class="primary-button" type="submit">登记</button>
  </form>
</div>
