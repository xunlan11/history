<div class="form-sheet hidden" id="document-form-sheet" role="dialog" aria-modal="true" aria-labelledby="add-document-title">
  <form class="panel form-panel" id="document-form">
    <div class="section-heading">
      <h3 id="add-document-title">新增文献</h3>
      <button class="icon-button subtle" id="close-document-form" type="button" title="关闭">×</button>
    </div>
    <div class="file-picker-field">
      <div class="file-picker-toolbar">
        <input id="file-input" name="file" type="file" accept=".pdf,image/*" multiple />
        <label class="file-picker-button" for="file-input">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 16V4"></path>
            <path d="m6 10 6-6 6 6"></path>
            <path d="M4 20h16"></path>
          </svg>
          选择文件
        </label>
        <span class="file-picker-hint">将按从上到下的顺序合并</span>
      </div>
      <div class="file-picker">
        <ol class="upload-file-list" id="upload-file-list" aria-label="待合并文件，按从上到下的顺序排列"></ol>
        <template id="upload-file-template">
          <li class="file-upload-row">
            <button class="file-upload-drag" type="button" draggable="true" title="拖动换序，也可使用上下方向键" aria-label="调整文件顺序">⠿</button>
            <span class="file-picker-name"></span>
            <span class="file-upload-controls">
              <button class="file-upload-remove" type="button" title="删除文件或取消上传" aria-label="删除文件或取消上传">×</button>
              <span class="file-upload-status" aria-live="polite">
                <span class="file-upload-meter">
                  <progress max="100" value="0" aria-label="原件上传进度"></progress>
                </span>
                <span class="file-upload-failed hidden">上传失败</span>
              </span>
            </span>
          </li>
        </template>
      </div>
    </div>
    <section class="info-field" aria-labelledby="document-info-title">
      <div class="info-field-heading">
        <span id="document-info-title">信息</span>
        <span>可留空，会自动识别</span>
      </div>
      <label>
        文献名
        <input id="title-input" name="title" type="text" />
      </label>
      <div class="field-grid metadata-grid">
        <label>
          著者
          <input id="author-input" name="author" type="text" />
        </label>
        <label>
          出版社
          <input id="publisher-input" name="publisher" type="text" />
        </label>
        <label>
          出版时间
          <input id="year-input" name="year" type="text" />
        </label>
      </div>
    </section>
    <label>
      标签
      <input id="tags-input" name="tags" type="text" placeholder="以逗号分隔" />
    </label>
    <fieldset class="processing-mode-field">
      <legend>处理方式</legend>
      <div class="processing-mode-options">
        <label class="processing-mode-option">
          <input type="radio" name="processingMode" value="chunked" checked />
          <span>
            <span class="processing-mode-text">
              <strong>大串小并</strong>
              <small>每部分<span class="processing-chunk-size"><input id="chunk-size-input" name="chunkSize" type="number" min="1" max="10" step="1" value="3" inputmode="numeric" aria-label="每部分页数" /><em>页</em></span></small>
            </span>
          </span>
        </label>
        <label class="processing-mode-option">
          <input type="radio" name="processingMode" value="serial" />
          <span>串行</span>
        </label>
        <label class="processing-mode-option">
          <input type="radio" name="processingMode" value="parallel" />
          <span>并行</span>
        </label>
      </div>
    </fieldset>
    <p class="registration-error" id="registration-error" role="alert"></p>
    <button class="primary-button" id="register-document" type="submit" disabled>登记</button>
  </form>
</div>
