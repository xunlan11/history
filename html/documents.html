<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>文献库 · 近代军史数智平台</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body data-page="documents">
    <div class="app-shell">
      <main class="main">
        <section class="view active" id="documents-view" aria-label="文献库">
          <header class="documents-topbar">
            <div class="documents-nav">
              <button class="ghost-link" type="button" data-view="library">‹ 返回首页</button>
            </div>
            <div class="status-title">
              <p class="eyebrow">文献库</p>
            </div>
            <span class="documents-count" id="all-document-count">0 项在库</span>
          </header>

          <section class="shelf-stage documents-stage" aria-label="书架">
            <div class="document-list" id="all-document-list"></div>
          </section>

          <footer class="documents-bottombar" aria-label="文献库操作栏">
            <p class="documents-hint">长按文献可换序或删除</p>
          </footer>
        </section>
      </main>
    </div>

    <div id="delete-fragment-slot" data-title="删除文献"></div>
    <div id="registration-fragment-slot"></div>
    <div id="card-fragment-slot"></div>

    <script src="../js/bootstrap.js"></script>
  </body>
</html>
